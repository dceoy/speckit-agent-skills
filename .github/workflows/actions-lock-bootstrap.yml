---
name: Bootstrap Actions lockfile and verification workflow
on:
  push:
    branches: [codex/add-actions-lockfiles]
    paths: [.github/workflows/actions-lock-bootstrap.yml]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate and verify lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/actions-lock-bootstrap.yml
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --no-interactive --no-narrow --no-migrate-local-actions
          gh actions-lock --verify
          python3 - <<'PY'
          import base64
          from pathlib import Path
          for path in sorted(Path(".github/workflows").glob("*")):
              if path.is_file():
                  print("LOCKFILE_RESULT " + str(path) + " " + base64.b64encode(path.read_bytes()).decode())
          PY
