---
name: CodeQL
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/action.yml'
      - '**/action.yaml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/action.yml'
      - '**/action.yaml'
  workflow_dispatch:
permissions: {}
jobs:
  github-codeql-analysis:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: dceoy/gha-for-devops/.github/workflows/github-codeql-analysis.yml@a49d8c5289d9ac33c9eef275f0238dd6a8b306d5  # v2.3.5
    with:
      language: >
        ["actions"]
